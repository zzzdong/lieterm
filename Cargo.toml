[package]
name = "lieterm"
version = "0.1.0"
edition = "2024"

[dependencies]
zzzui = { path = "../zzzui" }
alacritty_terminal = "0.26.0"
russh = "0.65.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
anyhow = "1"
russh-sftp = "3.0.1"
# known_hosts 的 |1| hashed hostname 校验（HMAC-SHA1，OpenSSH 格式）。
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# 会话与宏的本地配置（~/.config/lieterm/config.json）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rz/sz：ZMODEM 协议状态机（MIT/Apache-2.0，无 I/O，由调用方驱动）。
zmodem2 = "0.7.3"

# 本地 shell 试验模式（LIETERM_LOCAL）：Windows 用 ConPTY，Unix 用 pty。
[target.'cfg(windows)'.dependencies]
conpty = "0.7.0"

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"

[dev-dependencies]
# 内存 SSH 服务器测试：生成临时 Ed25519 主机/用户密钥。
rand = "0.10"
